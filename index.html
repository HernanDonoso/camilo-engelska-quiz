<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Camilos Engelska-quiz</title>
<meta name="theme-color" content="#4a6cf7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eng-quiz">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 60%);
    color: #1e2433;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    min-height: 100%;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 { font-size: 1.4rem; margin: 0 0 2px 0; }
  .sub { color: #6b7280; font-size: 0.9rem; margin-bottom: 18px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  button {
    cursor: pointer;
    border: 1px solid #d7dcea;
    background: #fff;
    color: #1e2433;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 500;
    -webkit-user-select: none;
    user-select: none;
  }
  button.active { background: #4a6cf7; color: #fff; border-color: #4a6cf7; }
  .card {
    width: 100%;
    min-height: 180px;
    border: 1px solid #d7dcea;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 6px 20px rgba(30,36,51,0.06);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .word { font-size: 2rem; font-weight: 700; line-height: 1.2; }
  .chapter { font-size: 0.85rem; color: #6b7280; margin-top: 10px; }
  .controls { display: flex; gap: 10px; margin-top: 18px; width: 100%; }
  .controls button { flex: 1; padding: 16px; font-size: 1.05rem; }
  .knew { border-color: #22a55a; color: #178a46; }
  .didnt { border-color: #e0514a; color: #c23a33; }
  .rowbtns { display: flex; gap: 10px; margin-top: 10px; width: 100%; }
  .rowbtns button { flex: 1; font-size: 0.9rem; padding: 10px; }
  .progress { margin-top: 14px; font-size: 0.9rem; color: #6b7280; text-align: center; }
  .masteredLine { font-size: 0.9rem; color: #374151; margin-bottom: 6px; font-weight: 600; }
  input[type=text] {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #d7dcea;
    background: #fff;
    color: #1e2433;
    font-size: 1.1rem;
    margin-top: 14px;
  }
  .feedback { margin-top: 10px; font-size: 1rem; min-height: 1.3em; text-align: center; font-weight: 600; }
  .ok { color: #178a46; }
  .bad { color: #c23a33; }
  .bar { width: 100%; height: 10px; border-radius: 5px; background: #e5e9f5; margin-top: 8px; overflow: hidden; }
  .bar-fill { height: 100%; background: #4a6cf7; width: 0%; transition: width .3s; }
  .bestScore { margin-top: 14px; font-size: 0.9rem; color: #6b7280; text-align: center; }
  .footer { margin-top: 28px; font-size: 0.75rem; color: #9aa3b2; text-align: center; }
  .facitGroup { margin-bottom: 18px; }
  .facitGroup h3 { font-size: 1rem; margin: 0 0 8px 0; color: #374151; }
  table.facitTable { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(30,36,51,0.05); }
  table.facitTable th, table.facitTable td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #eef0f6; font-size: 0.95rem; }
  table.facitTable th { background: #f3f5fb; color: #374151; font-weight: 600; font-size: 0.85rem; }
  table.facitTable tr:last-child td { border-bottom: none; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>📘 Camilos Engelska-quiz</h1>
    <div class="sub">40 ord från Skills chapter 1–3 + memory cards — prov torsdag v.41</div>

    <div class="tabs">
      <button id="tabFlip" class="active">🔄 Flip-kort</button>
      <button id="tabQuiz">⌨️ Skriv-quiz</button>
      <button id="tabFacit">📋 Facit</button>
    </div>

    <div id="flipView">
      <div class="masteredLine" id="masteredCount"></div>
      <div class="bar"><div class="bar-fill" id="flipBarTotal"></div></div>
      <div class="card" id="flipCard" style="margin-top:14px;">
        <div class="word" id="flipWord">...</div>
        <div class="chapter" id="flipChapter"></div>
      </div>
      <div class="controls">
        <button class="didnt" id="btnDidnt">😕 Kunde inte</button>
        <button class="knew" id="btnKnew">😄 Kunde!</button>
      </div>
      <div class="rowbtns">
        <button id="btnNewRound">🔁 Nytt varv (okända ord)</button>
        <button id="btnAllWords">📚 Alla 40 ord</button>
      </div>
      <div class="progress" id="flipProgress"></div>
    </div>

    <div id="quizView" style="display:none; width:100%;">
      <div class="card" id="quizCard">
        <div class="word" id="quizWord">...</div>
        <div class="chapter">Skriv den engelska översättningen</div>
      </div>
      <input type="text" id="quizInput" placeholder="skriv här och tryck Enter" autocomplete="off" autocapitalize="off" autocorrect="off">
      <div class="rowbtns">
        <button id="btnQuizCheck">✅ Kolla svar</button>
        <button id="btnQuizRestart">🔁 Börja om</button>
      </div>
      <div class="feedback" id="quizFeedback"></div>
      <div class="progress" id="quizProgress"></div>
      <div class="bestScore" id="bestScore"></div>
    </div>

    <div id="facitView" style="display:none; width:100%;">
      <div id="facitList"></div>
    </div>

    <div class="footer">
      <button id="tabResetProgress" style="padding:8px 12px; font-size:0.8rem;">Nollställ sparat framsteg</button>
    </div>
  </div>

<script src="app.js?v=2"></script>
</body>
</html>
